<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Cartagena, territorio de participación ciudadana</title>
  <desc id="desc">Ilustración editorial de Cartagena con mar, arquitectura histórica, ciudad moderna y una red de participación cívica.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="0.62" stop-color="#E7F2FD"/>
      <stop offset="1" stop-color="#CDE5F7"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A90E2"/>
      <stop offset="1" stop-color="#178C8C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD057"/>
      <stop offset="1" stop-color="#F5B700"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2A66"/>
      <stop offset="1" stop-color="#16478F"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0A2A66" flood-opacity="0.14"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" rx="56" fill="url(#sky)"/>
  <circle cx="1300" cy="185" r="110" fill="#F5B700" opacity="0.14" filter="url(#soft)"/>
  <circle cx="1300" cy="185" r="58" fill="#F5B700" opacity="0.92"/>

  <path d="M0 690C205 646 354 701 542 674C772 641 954 580 1193 612C1368 636 1481 604 1600 574V1000H0Z" fill="url(#sea)" opacity="0.92"/>
  <path d="M0 720C239 675 413 739 596 705C839 660 1035 636 1242 665C1408 688 1506 663 1600 643" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4"/>

  <!-- modern skyline -->
  <g opacity="0.92">
    <rect x="90" y="440" width="48" height="230" rx="4" fill="#6F9FCB"/>
    <rect x="148" y="390" width="58" height="280" rx="4" fill="#4A90E2"/>
    <rect x="220" y="462" width="42" height="208" rx="4" fill="#8AB4D8"/>
    <rect x="277" y="350" width="72" height="320" rx="5" fill="#2F6FAE"/>
    <rect x="365" y="415" width="50" height="255" rx="4" fill="#6F9FCB"/>
    <rect x="429" y="300" width="76" height="370" rx="5" fill="#0A2A66" opacity="0.72"/>
    <rect x="521" y="430" width="55" height="240" rx="4" fill="#4A90E2"/>
    <g fill="#DCEBFA" opacity="0.92">
      <rect x="159" y="420" width="8" height="18"/><rect x="181" y="420" width="8" height="18"/>
      <rect x="292" y="385" width="10" height="22"/><rect x="320" y="385" width="10" height="22"/>
      <rect x="450" y="338" width="12" height="24"/><rect x="475" y="338" width="12" height="24"/>
    </g>
  </g>

  <!-- colonial city -->
  <g filter="url(#shadow)">
    <path d="M620 644H1160V744H620Z" fill="#F2D2A4"/>
    <path d="M650 604h110v140H650z" fill="#F6E4C8"/>
    <path d="M650 604l55-50 55 50z" fill="#D77A2E"/>
    <path d="M795 575h150v169H795z" fill="#F5C673"/>
    <path d="M795 575l75-65 75 65z" fill="#C95E2D"/>
    <path d="M982 610h142v134H982z" fill="#F8E8CE"/>
    <path d="M982 610l71-55 71 55z" fill="#D87432"/>

    <!-- cathedral dome -->
    <path d="M945 535c0-94 54-151 111-151s111 57 111 151v209H945Z" fill="#E3A84F"/>
    <path d="M985 503c0-60 32-102 71-102s71 42 71 102" fill="#F5C96B"/>
    <path d="M1048 365h16v43h-16z" fill="#0A2A66"/>
    <path d="M1030 365l26-42 26 42z" fill="#F5B700"/>
    <circle cx="1056" cy="323" r="8" fill="#D72638"/>
    <g fill="#0A2A66" opacity="0.72">
      <rect x="982" y="570" width="24" height="50" rx="12"/><rect x="1044" y="570" width="24" height="50" rx="12"/><rect x="1106" y="570" width="24" height="50" rx="12"/>
    </g>

    <!-- clock tower abstraction -->
    <rect x="1203" y="430" width="155" height="314" rx="8" fill="url(#gold)"/>
    <path d="M1182 454h197l-37-54h-123z" fill="#D98725"/>
    <path d="M1233 401l48-89 48 89z" fill="#F5B700"/>
    <rect x="1275" y="270" width="12" height="52" fill="#0A2A66"/>
    <circle cx="1281" cy="259" r="10" fill="#D72638"/>
    <circle cx="1281" cy="522" r="41" fill="#FFF7DE" stroke="#0A2A66" stroke-width="7"/>
    <path d="M1281 522l18-16M1281 522v-23" stroke="#0A2A66" stroke-width="5" stroke-linecap="round"/>
    <path d="M1240 744v-104c0-32 18-55 41-55s41 23 41 55v104" fill="#0A2A66" opacity="0.84"/>
  </g>

  <!-- civic network -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M166 260C394 172 564 201 743 314S1076 424 1345 272" stroke="#0A2A66" stroke-opacity="0.22" stroke-width="4" stroke-dasharray="10 16"/>
    <path d="M319 228C502 323 621 380 832 310S1182 194 1432 350" stroke="#4A90E2" stroke-opacity="0.26" stroke-width="3"/>
    <path d="M546 226C687 178 777 197 874 257" stroke="#D72638" stroke-opacity="0.22" stroke-width="3"/>
  </g>
  <g filter="url(#shadow)">
    <g transform="translate(166 260)"><circle r="27" fill="#FFFFFF"/><circle r="13" fill="#D72638"/></g>
    <g transform="translate(319 228)"><circle r="24" fill="#FFFFFF"/><circle r="11" fill="#F5B700"/></g>
    <g transform="translate(546 226)"><circle r="25" fill="#FFFFFF"/><circle r="12" fill="#4A90E2"/></g>
    <g transform="translate(832 310)"><circle r="30" fill="#FFFFFF"/><circle r="14" fill="#178C8C"/></g>
    <g transform="translate(1120 302)"><circle r="25" fill="#FFFFFF"/><circle r="12" fill="#0A2A66"/></g>
    <g transform="translate(1432 350)"><circle r="27" fill="#FFFFFF"/><circle r="13" fill="#D72638"/></g>
  </g>

  <!-- civic cards -->
  <g filter="url(#shadow)">
    <rect x="92" y="88" width="330" height="102" rx="24" fill="#FFFFFF" fill-opacity="0.94"/>
    <rect x="118" y="114" width="50" height="50" rx="16" fill="#EAF1FB"/>
    <path d="M130 145l9-9 8 6 10-13" fill="none" stroke="#0A2A66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="190" y="116" width="175" height="13" rx="6" fill="#0A2A66" opacity="0.9"/>
    <rect x="190" y="143" width="120" height="9" rx="5" fill="#6E7D91" opacity="0.42"/>
    <rect x="190" y="163" width="88" height="8" rx="4" fill="#F5B700"/>

    <rect x="1230" y="92" width="270" height="94" rx="24" fill="#0A2A66" fill-opacity="0.94"/>
    <circle cx="1272" cy="139" r="18" fill="#F5B700"/>
    <path d="M1264 139l6 6 12-14" fill="none" stroke="#0A2A66" stroke-width="4" stroke-linecap="round"/>
    <rect x="1307" y="117" width="148" height="11" rx="5" fill="#FFFFFF" opacity="0.92"/>
    <rect x="1307" y="142" width="111" height="8" rx="4" fill="#AFC7EC"/>
  </g>

  <!-- flag accent -->
  <rect x="0" y="0" width="1600" height="12" fill="#F5B700"/>
  <rect x="0" y="12" width="1600" height="7" fill="#0A2A66"/>
  <rect x="0" y="19" width="1600" height="7" fill="#D72638"/>
</svg>