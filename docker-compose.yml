version: '3.9'

# ═══════════════════════════════════════════════════════════════════
# VÉRTICE OS — Docker Compose (Desarrollo Local)
# ═══════════════════════════════════════════════════════════════════

services:

  # ── Frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000
    depends_on:
      - api
    networks:
      - vertice-network

  # ── API Gateway (GraphQL) ─────────────────────────────────────────
  api:
    build:
      context: ./apps/api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://vertice:vertice@postgres:5432/vertice_os
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vertice-network

  # ── AI Orchestrator ───────────────────────────────────────────────
  ai:
    build:
      context: ./apps/ai
    ports:
      - "8001:8001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://redis:6379
      - PINECONE_API_KEY=${PINECONE_API_KEY}
    volumes:
      - ./apps/ai:/home/vertice/app
    depends_on:
      - redis
    networks:
      - vertice-network

  # ── PostgreSQL + PostGIS ──────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: vertice_os
      POSTGRES_USER: vertice
      POSTGRES_PASSWORD: vertice
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertice -d vertice_os"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vertice-network

  # ── MongoDB ───────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: vertice
      MONGO_INITDB_ROOT_PASSWORD: vertice
      MONGO_INITDB_DATABASE: vertice_os
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - vertice-network

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    command: redis-server --requirepass vertice --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "vertice", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vertice-network

  # ── Neo4j ─────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.21
    environment:
      NEO4J_AUTH: neo4j/vertice_pass
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt
    volumes:
      - neo4j-data:/data
    networks:
      - vertice-network

# ── Volumes ────────────────────────────────────────────────────────
volumes:
  postgres-data:
  mongo-data:
  redis-data:
  neo4j-data:

# ── Networks ───────────────────────────────────────────────────────
networks:
  vertice-network:
    driver: bridge
