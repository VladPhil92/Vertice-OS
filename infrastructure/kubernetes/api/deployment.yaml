apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: vertice
  labels:
    app: vertice-os
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vertice-os
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vertice-os
        component: api
    spec:
      # Must exceed the API's bounded 15s shutdown deadline so Fastify can stop
      # accepting traffic and close Postgres/Redis/Neo4j before SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/vladphil92/vertice-api:latest  # Replace with versioned tag/digest in CI/CD before production use
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: vertice-config
            - secretRef:
                name: vertice-secrets
          # Liveness must never depend on Postgres/Redis/Neo4j. Restarting a
          # healthy process because a dependency is down amplifies incidents.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Serving readiness is fail-closed only for core dependencies.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
