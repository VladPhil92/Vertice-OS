apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: vertice
  labels:
    app: vertice-os
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vertice-os
      component: postgres
  strategy:
    type: Recreate  # Required for single-instance stateful workload with RWO PVC
  template:
    metadata:
      labels:
        app: vertice-os
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: vertice
            - name: POSTGRES_DB
              value: vertice_os
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vertice-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - vertice
                - -d
                - vertice_os
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - vertice
                - -d
                - vertice_os
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
