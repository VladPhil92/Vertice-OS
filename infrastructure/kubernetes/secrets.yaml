# NUNCA commitear con valores reales — usar kubectl create secret o Vault
# Este archivo es solo un template de estructura. En producción usar:
#   kubectl create secret generic vertice-secrets -n vertice \
#     --from-literal=DATABASE_URL='...' --from-literal=JWT_SECRET='...' ...
# O sincronizar desde HashiCorp Vault / AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: vertice-secrets
  namespace: vertice
  labels:
    app: vertice-os
    component: secrets
type: Opaque
stringData:
  # PostgreSQL
  DATABASE_URL: "postgresql://vertice:REPLACE_ME@postgres:5432/vertice_os"  # REPLACE_ME
  POSTGRES_PASSWORD: "REPLACE_ME"  # REPLACE_ME — must match DATABASE_URL password

  # Redis
  REDIS_PASSWORD: "REPLACE_ME"  # REPLACE_ME

  # Neo4j
  NEO4J_PASSWORD: "REPLACE_ME"  # REPLACE_ME

  # Auth
  JWT_SECRET: "REPLACE_ME"        # REPLACE_ME — min 64 chars random string
  BCRYPT_ROUNDS: "12"

  # Internal service auth
  AI_SERVICE_SECRET: "REPLACE_ME"  # REPLACE_ME

  # External APIs
  ANTHROPIC_API_KEY: "REPLACE_ME"   # REPLACE_ME — sk-ant-...
  PINECONE_API_KEY: "REPLACE_ME"    # REPLACE_ME
  VOYAGE_API_KEY: "REPLACE_ME"      # REPLACE_ME

  # Frontend / Maps
  NEXT_PUBLIC_MAPBOX_TOKEN: "REPLACE_ME"  # REPLACE_ME — pk.eyJ1...

  # Notifications
  SENDGRID_API_KEY: "REPLACE_ME"  # REPLACE_ME — SG....

  # Observability
  SENTRY_DSN: "REPLACE_ME"  # REPLACE_ME

  # Blockchain
  POLYGON_PRIVATE_KEY: "REPLACE_ME"  # REPLACE_ME — 0x... NEVER expose
