apiVersion: v1
kind: ConfigMap
metadata:
  name: vertice-config
  namespace: vertice
  labels:
    app: vertice-os
    component: config
data:
  # API / Backend
  NODE_ENV: "production"
  PORT: "4000"
  HOST: "0.0.0.0"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "https://vertice.co"

  # Internal service URLs (cluster-internal DNS)
  REDIS_URL: "redis://redis:6379"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  AI_SERVICE_URL: "http://ai:8001"

  # Frontend (Next.js public vars)
  NEXT_PUBLIC_API_URL: "https://api.vertice.co"
  NEXT_PUBLIC_WS_URL: "wss://api.vertice.co"
  NEXT_PUBLIC_ENVIRONMENT: "production"

  # AI / Vector DB
  PINECONE_INDEX: "vertice-rag"
