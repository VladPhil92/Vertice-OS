apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: vertice
  labels:
    app: vertice-os
    component: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vertice-os
      component: ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vertice-os
        component: ai
    spec:
      containers:
        - name: ai
          image: ghcr.io/vladphil92/vertice-ai:latest  # Replace with versioned tag in CI/CD
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - secretRef:
                name: vertice-secrets
            - configMapRef:
                name: vertice-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 60  # AI service takes longer to initialize (model loading)
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"  # AI orchestrator (LangGraph + Claude API) needs headroom
