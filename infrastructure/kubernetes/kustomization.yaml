apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vertice

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: vertice-os

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - neo4j/pvc.yaml
  - neo4j/deployment.yaml
  - neo4j/service.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/hpa.yaml
  - web/deployment.yaml
  - web/service.yaml
  - web/hpa.yaml
  - ai/deployment.yaml
  - ai/service.yaml
  - ai/hpa.yaml
  - ingress.yaml
