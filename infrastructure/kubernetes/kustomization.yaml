apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vertice

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: vertice-os

# `vertice-secrets` is intentionally NOT generated from a tracked file.
# Provision it separately from secrets.example.yaml, kubectl, External Secrets,
# Vault or the cloud provider's secret manager before applying this base.
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - neo4j/pvc.yaml
  - neo4j/deployment.yaml
  - neo4j/service.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/hpa.yaml
  - web/deployment.yaml
  - web/service.yaml
  - web/hpa.yaml
  - ai/deployment.yaml
  - ai/service.yaml
  - ai/hpa.yaml
  - ingress.yaml
