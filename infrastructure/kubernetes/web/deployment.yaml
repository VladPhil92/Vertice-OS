apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: vertice
  labels:
    app: vertice-os
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vertice-os
      component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vertice-os
        component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/vladphil92/vertice-web:latest  # Replace with versioned tag in CI/CD
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: vertice-config
            - secretRef:
                name: vertice-secrets
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
