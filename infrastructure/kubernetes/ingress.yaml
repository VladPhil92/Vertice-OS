apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vertice-ingress
  namespace: vertice
  labels:
    app: vertice-os
    component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
    - hosts:
        - vertice.co
        - api.vertice.co
      secretName: vertice-tls
  rules:
    - host: vertice.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
    - host: api.vertice.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
  # ai:8001 NO se expone públicamente — el API actúa como proxy interno
