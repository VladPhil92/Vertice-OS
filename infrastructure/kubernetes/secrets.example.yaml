# Example only. Copy locally to secrets.yaml or provision the Secret with an external
# secret manager / kubectl. Never commit production credentials.
apiVersion: v1
kind: Secret
metadata:
  name: vertice-secrets
  namespace: vertice
  labels:
    app: vertice-os
    component: secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://vertice:REPLACE_ME@postgres:5432/vertice_os"
  POSTGRES_PASSWORD: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
  NEO4J_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME_MIN_64_RANDOM_CHARS"
  BCRYPT_ROUNDS: "12"
  AI_SERVICE_SECRET: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
  PINECONE_API_KEY: "REPLACE_ME"
  VOYAGE_API_KEY: "REPLACE_ME"
  NEXT_PUBLIC_MAPBOX_TOKEN: "REPLACE_ME"
  SENDGRID_API_KEY: "REPLACE_ME"
  SENTRY_DSN: "REPLACE_ME"
  POLYGON_PRIVATE_KEY: "REPLACE_ME"
