name: Diagnose governance ledger test

on:
  push:
    branches:
      - fix/governance-ledger-deterministic-precedence
    paths:
      - .github/workflows/diagnose-governance-ledger-test.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: vertice_test
          POSTGRES_USER: vertice
          POSTGRES_PASSWORD: vertice_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/vertice_test
          NEO4J_PLUGINS: '["apoc"]'
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 8
        ports:
          - 7687:7687
          - 7474:7474
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize test database
        env:
          DATABASE_URL: postgresql://vertice:vertice_test@localhost:5432/vertice_test
        run: psql "$DATABASE_URL" -f infrastructure/db/init.sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cd apps/ai && pip install -r requirements.txt
      - name: Run full test command
        id: full
        shell: bash
        env:
          DATABASE_URL: postgresql://vertice:vertice_test@localhost:5432/vertice_test
          REDIS_URL: redis://localhost:6379
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: vertice_test
          NODE_ENV: test
        run: |
          set +e
          pnpm test 2>&1 | tee /tmp/full-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish diagnostic to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Full test diagnostic'
            echo
            echo '\`\`\`text'
            grep -n -E -A 35 -B 15 'FAIL |Error:|AssertionError|Test Suites:|Tests:' /tmp/full-test.log | tail -n 220 || tail -n 220 /tmp/full-test.log
            echo '\`\`\`'
            echo
            echo "Exit status: ${{ steps.full.outputs.status }}"
          } > /tmp/comment.md
          gh pr comment 40 --repo VladPhil92/Vertice-OS --body-file /tmp/comment.md
