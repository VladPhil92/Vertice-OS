name: Diagnose governance ledger test

on:
  push:
    branches:
      - fix/governance-ledger-deterministic-precedence
    paths:
      - .github/workflows/diagnose-governance-ledger-test.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run focused ledger regression
        id: focused
        shell: bash
        run: |
          set +e
          cd apps/api
          NODE_OPTIONS=--experimental-vm-modules pnpm exec jest src/modules/governance/__tests__/governance.vote-ledger.test.ts --runInBand 2>&1 | tee /tmp/ledger-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish diagnostic to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Focused governance ledger diagnostic'
            echo
            echo '\`\`\`text'
            tail -n 180 /tmp/ledger-test.log
            echo '\`\`\`'
            echo
            echo "Exit status: ${{ steps.focused.outputs.status }}"
          } > /tmp/comment.md
          gh pr comment 40 --repo VladPhil92/Vertice-OS --body-file /tmp/comment.md
