name: Apply governance ledger phase

on:
  push:
    branches:
      - feat/governance-liquid-democracy-ledger
    paths:
      - .github/workflows/apply-governance-ledger-phase.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply ledger and delegation hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Replace castVote with an atomic participation-ledger contract.
          service = Path('apps/api/src/modules/governance/governance.service.ts')
          text = service.read_text()
          pattern = re.compile(
              r"export async function castVote\([\s\S]*?\n}\n\n// ── getVoteTally",
              re.MULTILINE,
          )
          replacement = r'''export async function castVote(
            proposalId: string,
            citizenId: string,
            voteValue: -1 | 0 | 1,
          ): Promise<VoteReceipt> {
            const rows = await prisma.$queryRaw<ProposalRow[]>(Prisma.sql`
              SELECT id, status, category, voting_ends_at FROM proposals WHERE id = ${proposalId}::uuid
            `)

            if (rows.length === 0) throw makeError('Propuesta no encontrada', 404, 'PROPOSAL_NOT_FOUND')

            const proposal = rows[0]

            if (proposal.status !== 'voting') {
              throw makeError('La propuesta no está en período de votación', 400, 'WRONG_STATUS')
            }

            if (proposal.voting_ends_at && new Date() >= proposal.voting_ends_at) {
              throw makeError('El período de votación ha cerrado', 400, 'VOTING_CLOSED')
            }

            const nullifier = voteNullifier(citizenId, proposalId)

            // El padrón congelado es la autoridad de admisión durante toda la
            // ventana de votación. La assurance se evaluó al construir el snapshot.
            const checkRows = await prisma.$queryRaw<Array<{
              already_voted: bigint | number
              reputation_score: string | number
              eligible?: boolean
            }>>(Prisma.sql`
              SELECT
                (SELECT COUNT(*) FROM votes WHERE nullifier_hash = ${nullifier})::int AS already_voted,
                c.reputation_score,
                EXISTS(
                  SELECT 1
                  FROM proposal_voter_roll pvr
                  WHERE pvr.proposal_id = ${proposalId}::uuid
                    AND pvr.citizen_id = c.id
                ) AS eligible
              FROM citizens c
              WHERE c.id = ${citizenId}::uuid
            `)

            if (checkRows.length === 0) throw makeError('Ciudadano no encontrado', 404, 'CITIZEN_NOT_FOUND')

            if (checkRows[0].eligible === false) {
              throw makeError('No perteneces al padrón electoral de esta propuesta', 403, 'NOT_ELIGIBLE_VOTER')
            }

            if (Number(checkRows[0].already_voted) > 0) {
              throw makeError('Ya has participado en esta propuesta', 409, 'ALREADY_VOTED')
            }

            const voteWeight = computeVoteWeight(Number(checkRows[0].reputation_score))

            // El voto, los recibos de participación delegada y el tally se escriben
            // en una sola transacción. El trigger de votes reclama primero el
            // nullifier directo en vote_participations; si ya fue consumido por una
            // delegación concurrente, el INSERT devuelve 0 filas y no hay doble voz.
            const result = await prisma.$transaction(async (tx) => {
              const voteRows = await tx.$queryRaw<VoteRow[]>(Prisma.sql`
                INSERT INTO votes (proposal_id, nullifier_hash, vote_weight, vote_value)
                VALUES (${proposalId}::uuid, ${nullifier}, ${voteWeight}, ${voteValue})
                ON CONFLICT (nullifier_hash) DO NOTHING
                RETURNING id, vote_weight, vote_value, created_at
              `)

              if (voteRows.length === 0) {
                throw makeError('Ya has participado en esta propuesta', 409, 'ALREADY_VOTED')
              }

              // Precedencia determinística: proposal > domain > general. DISTINCT ON
              // se aplica antes de filtrar por delegate_id, de modo que un delegador
              // no puede aportar a dos delegados distintos por scopes superpuestos.
              const delegatorRows = await tx.$queryRaw<Array<{ delegator_id: string }>>(Prisma.sql`
                WITH effective_delegations AS (
                  SELECT DISTINCT ON (d.delegator_id)
                    d.delegator_id,
                    d.delegate_id
                  FROM delegations d
                  INNER JOIN proposal_voter_roll pvr
                    ON pvr.citizen_id = d.delegator_id
                   AND pvr.proposal_id = ${proposalId}::uuid
                  WHERE d.is_active = true
                    AND d.valid_from <= NOW()
                    AND (d.valid_until IS NULL OR d.valid_until > NOW())
                    AND (
                      d.delegation_type = 'general'
                      OR (d.delegation_type = 'domain' AND d.domain = ${proposal.category})
                      OR (d.delegation_type = 'proposal' AND d.proposal_id = ${proposalId}::uuid)
                    )
                  ORDER BY
                    d.delegator_id,
                    CASE d.delegation_type
                      WHEN 'proposal' THEN 3
                      WHEN 'domain' THEN 2
                      ELSE 1
                    END DESC,
                    d.created_at DESC,
                    d.id DESC
                )
                SELECT ed.delegator_id
                FROM effective_delegations ed
                WHERE ed.delegate_id = ${citizenId}::uuid
              `)

              const delegatedNullifiers = delegatorRows.map((d) => voteNullifier(d.delegator_id, proposalId))
              let delegatedCount = 0

              if (delegatedNullifiers.length > 0) {
                const values = delegatedNullifiers.map((hash) => Prisma.sql`
                  (${proposalId}::uuid, ${hash}, 'delegated')
                `)
                const claimed = await tx.$queryRaw<Array<{ nullifier_hash: string }>>(Prisma.sql`
                  INSERT INTO vote_participations (proposal_id, nullifier_hash, participation_mode)
                  VALUES ${Prisma.join(values)}
                  ON CONFLICT (nullifier_hash) DO NOTHING
                  RETURNING nullifier_hash
                `)
                delegatedCount = claimed.length
              }

              const totalWeight = voteWeight + delegatedCount

              // total_votes representa participantes únicos, no solo ballots directos.
              // Esto alinea el numerador del quórum con el padrón congelado.
              await tx.$queryRaw(Prisma.sql`
                UPDATE proposals SET
                  total_votes = total_votes + ${totalWeight},
                  approve_votes_weighted  = approve_votes_weighted  + CASE WHEN ${voteValue} =  1 THEN ${totalWeight}::decimal ELSE 0 END,
                  reject_votes_weighted   = reject_votes_weighted   + CASE WHEN ${voteValue} = -1 THEN ${totalWeight}::decimal ELSE 0 END,
                  abstain_votes_weighted  = abstain_votes_weighted  + CASE WHEN ${voteValue} =  0 THEN ${totalWeight}::decimal ELSE 0 END
                WHERE id = ${proposalId}::uuid
              `)

              return { vote: voteRows[0], totalWeight, delegatedCount }
            })

            await delCache('proposal', proposalId)

            fireReputation({ citizen_id: citizenId, event_type: 'vote_cast', reference_id: proposalId })
            publish('governance', 'proposal:vote_cast', { proposal_id: proposalId, vote_value: voteValue }).catch(() => null)

            return {
              vote_id: result.vote.id,
              vote_weight: result.totalWeight,
              vote_value: result.vote.vote_value,
              proposal_id: proposalId,
              created_at: result.vote.created_at,
              delegated_count: result.delegatedCount,
            }
          }

          // ── getVoteTally'''
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'castVote replacement count={count}')
          service.write_text(text2)

          # 2) Prisma schema: explicit privacy-preserving participation ledger.
          schema = Path('apps/api/prisma/schema.prisma')
          s = schema.read_text()
          if 'voteParticipations VoteParticipation[]' not in s:
              s = s.replace('  votes        Vote[]\n', '  votes        Vote[]\n  voteParticipations VoteParticipation[]\n', 1)
          if 'model VoteParticipation {' not in s:
              marker = '// ── Delegaciones ───────────────────────────────────────────────────────────────\n'
              model = '''// ── Participación electoral ────────────────────────────────────────────────────
// Ledger separado del sentido del voto. Guarda solo nullifiers opacos y modo
// de participación para impedir doble influencia directa/delegada y auditar
// quórum sin enlazar ciudadanos con vote_value.
model VoteParticipation {
  id                String   @id @default(uuid()) @db.Uuid
  proposalId        String   @map("proposal_id") @db.Uuid
  nullifierHash     String   @unique @map("nullifier_hash") @db.VarChar(64)
  participationMode String   @map("participation_mode") @db.VarChar(16)
  createdAt         DateTime @default(now()) @map("created_at") @db.Timestamptz(6)

  proposal Proposal @relation(fields: [proposalId], references: [id], onDelete: Cascade)

  @@index([proposalId, participationMode], map: "idx_vote_participations_proposal_mode")
  @@map("vote_participations")
}

'''
              if marker not in s:
                  raise SystemExit('delegations marker not found in schema')
              s = s.replace(marker, model + marker, 1)
          schema.write_text(s)

          # 3) Migration + trigger: votes atomically claim the same nullifier ledger.
          migration_dir = Path('apps/api/prisma/migrations/20260903003500_vote_participation_ledger')
          migration_dir.mkdir(parents=True, exist_ok=True)
          (migration_dir / 'migration.sql').write_text('''-- Liquid democracy participation ledger.
-- The ledger intentionally stores no citizen_id and no vote_value.
CREATE TABLE "vote_participations" (
  "id" UUID NOT NULL DEFAULT gen_random_uuid(),
  "proposal_id" UUID NOT NULL,
  "nullifier_hash" VARCHAR(64) NOT NULL,
  "participation_mode" VARCHAR(16) NOT NULL,
  "created_at" TIMESTAMPTZ(6) NOT NULL DEFAULT CURRENT_TIMESTAMP,
  CONSTRAINT "vote_participations_pkey" PRIMARY KEY ("id"),
  CONSTRAINT "vote_participations_mode_check" CHECK ("participation_mode" IN ('direct', 'delegated')),
  CONSTRAINT "vote_participations_proposal_fkey" FOREIGN KEY ("proposal_id") REFERENCES "proposals"("id") ON DELETE CASCADE ON UPDATE CASCADE
);

CREATE UNIQUE INDEX "vote_participations_nullifier_hash_key"
  ON "vote_participations"("nullifier_hash");
CREATE INDEX "idx_vote_participations_proposal_mode"
  ON "vote_participations"("proposal_id", "participation_mode");

-- Existing direct votes become direct participation receipts. Historical
-- delegated participation cannot be reconstructed safely because prior code
-- stored only aggregate weight; no identity inference or synthetic backfill is attempted.
INSERT INTO "vote_participations" ("proposal_id", "nullifier_hash", "participation_mode", "created_at")
SELECT "proposal_id", "nullifier_hash", 'direct', "created_at"
FROM "votes"
ON CONFLICT ("nullifier_hash") DO NOTHING;

-- A BEFORE INSERT trigger gives direct votes and delegated claims one shared
-- uniqueness boundary. Returning NULL skips a direct vote whose nullifier was
-- already consumed by delegation, and the service maps the empty RETURNING set
-- to ALREADY_VOTED without exposing ballot information.
CREATE OR REPLACE FUNCTION claim_direct_vote_participation()
RETURNS TRIGGER AS $$
DECLARE
  claimed_hash VARCHAR(64);
BEGIN
  INSERT INTO "vote_participations" ("proposal_id", "nullifier_hash", "participation_mode")
  VALUES (NEW."proposal_id", NEW."nullifier_hash", 'direct')
  ON CONFLICT ("nullifier_hash") DO NOTHING
  RETURNING "nullifier_hash" INTO claimed_hash;

  IF claimed_hash IS NULL THEN
    RETURN NULL;
  END IF;

  RETURN NEW;
END;
$$ LANGUAGE plpgsql;

DROP TRIGGER IF EXISTS "trg_claim_direct_vote_participation" ON "votes";
CREATE TRIGGER "trg_claim_direct_vote_participation"
BEFORE INSERT ON "votes"
FOR EACH ROW
EXECUTE FUNCTION claim_direct_vote_participation();
''')

          # 4) Assurance tests: frozen electorate + deterministic effective delegation.
          assurance = Path('apps/api/src/modules/governance/__tests__/governance.assurance-policy.test.ts')
          a = assurance.read_text()
          target = """    expect(delegationSql).toContain('pvr.citizen_id')
              expect(delegationSql).toContain('d.valid_from <= NOW()')
          """
          repl = """    expect(delegationSql).toContain('pvr.citizen_id')
              expect(delegationSql).toContain('WITH effective_delegations AS')
              expect(delegationSql).toContain('DISTINCT ON (d.delegator_id)')
              expect(delegationSql).toContain(\"WHEN 'proposal' THEN 3\")
              expect(delegationSql).toContain(\"WHEN 'domain' THEN 2\")
              expect(delegationSql).toContain('WHERE ed.delegate_id')
              expect(delegationSql).toContain('d.valid_from <= NOW()')
          """
          if target not in a:
              raise SystemExit('assurance assertion anchor not found')
          assurance.write_text(a.replace(target, repl, 1))

          # 5) Service tests: claimed participation receipts determine delegated weight.
          tests = Path('apps/api/src/modules/governance/__tests__/governance.service.test.ts')
          t = tests.read_text()
          old_claim_none = """      // ninguno de los dos ha votado directamente todavía
              .mockResolvedValueOnce([])
          """
          new_claim_both = """      // ambos nullifiers quedan reclamados por el ledger de participación
              .mockImplementationOnce(async () => [
                { nullifier_hash: voteNullifierForTest('delegator-1', 'proposal-uuid') },
                { nullifier_hash: voteNullifierForTest('delegator-2', 'proposal-uuid') },
              ])
          """
          if old_claim_none not in t:
              raise SystemExit('delegator claim test anchor not found')
          t = t.replace(old_claim_none, new_claim_both, 1)

          old_partial = """      // La consulta de nullifiers ya votados devuelve el de delegator-1 —
              // debe calcularse con voteNullifier(), la misma función que el resto
              // del módulo, para que esta comparación sea correcta.
              .mockImplementationOnce(async () => [
                { nullifier_hash: voteNullifierForTest('delegator-1', 'proposal-uuid') },
              ])
          """
          new_partial = """      // Solo delegator-2 consigue reclamar el ledger; delegator-1 ya
              // participó antes (directa o delegadamente) y el UNIQUE lo excluye.
              .mockImplementationOnce(async () => [
                { nullifier_hash: voteNullifierForTest('delegator-2', 'proposal-uuid') },
              ])
          """
          if old_partial not in t:
              raise SystemExit('partial delegation test anchor not found')
          t = t.replace(old_partial, new_partial, 1)

          race_anchor = """  it('throws 409 on double vote', async () => {
          """
          race_test = """  it('rechaza participación directa si el ledger ya consumió el nullifier', async () => {
              mockQueryRaw
                .mockResolvedValueOnce([votingProposal])
                .mockResolvedValueOnce([{ already_voted: 0, reputation_score: '0.0000' }])
                // El trigger BEFORE INSERT devuelve NULL cuando una delegación concurrente
                // ya reclamó el nullifier; RETURNING queda vacío.
                .mockResolvedValueOnce([])

              await expect(castVote('proposal-uuid', 'citizen-uuid', 1)).rejects.toMatchObject({
                statusCode: 409,
                code: 'ALREADY_VOTED',
              })
            })

          """
          if race_anchor not in t:
              raise SystemExit('double-vote anchor not found')
          t = t.replace(race_anchor, race_test + race_anchor, 1)
          tests.write_text(t)

          # 6) Security contract documentation aligned with the implemented snapshot.
          docs = Path('docs/security/CIVIC_IDENTITY_ASSURANCE.md')
          docs.write_text('''# P0 — Civic Identity Assurance

## Objective

Separate authentication, contact verification and civic identity assurance. None is a substitute for the others.

## P0.2 trust contract

- `CIVIC_IDENTITY_ASSURANCE_PROVIDERS` is evaluated when a **new voter roll is frozen**.
- The allowlist is empty by default: future protected electorates fail closed until an audited provider exists.
- The canonical CTG One federation key is `ctg_one`; federation alone is not assurance evidence.
- Citizens entering a new roll require `verification_level >= 2` plus an authorized external identity.
- `/identity/assurance` exposes current onboarding state without relabeling email, wallet or declared-document checks as KYC.

Once a proposal enters `voting`, `proposal_voter_roll` is the immutable authorization snapshot for that voting window. Provider-policy changes apply to future voter rolls and never mutate an open electorate or its quorum denominator.

## Liquid-democracy invariant

Delegated participation uses the same frozen electorate. An effective delegation must be active, within its validity window and applicable to the proposal. Overlapping scopes resolve deterministically as:

1. proposal-specific;
2. matching domain;
3. general.

Only one effective delegation exists per delegator for a proposal. The selected row is resolved **before** filtering by delegate, preventing one citizen from contributing through multiple delegates.

Direct and delegated participation share a privacy-preserving `vote_participations` nullifier ledger. It stores neither `citizen_id` nor `vote_value`. A nullifier can be claimed once, so direct/delegated races cannot create double influence. `proposals.total_votes` counts unique participants, aligning the quorum numerator with the frozen electorate denominator.

## Provider onboarding rule

A provider must not enter the allowlist until its `external_identities` row is created only after successful identity proofing. SSO, email matching, wallet ownership, account age, civic reputation or possession of a CTG One account are insufficient.

## Remaining maturity work

1. integrate the selected production identity provider and signed callback/webhook contract;
2. persist assurance lifecycle metadata (verified/revoked/expired/review) independently from generic federation links;
3. extend assurance requirements to proposal creation and endorsement according to governance policy;
4. add administrative review, revocation, reconciliation and audit evidence;
5. expose actionable assurance onboarding in the citizen dashboard.

## Security invariant

No code path may infer general civic identity assurance from login, matching email, CTG One federation, self-declared cédula, wallet signature, reputation or historical roll membership. A frozen-roll entry authorizes only that proposal's voting window.
''')
          PY
      - name: Commit phase and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-governance-ledger-phase.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(governance): add participation ledger and effective delegation"
          git push
