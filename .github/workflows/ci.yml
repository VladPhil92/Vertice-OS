name: VÉRTICE OS — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Lint y Typecheck ────────────────────────────────────────────────────────
  quality:
    name: Calidad de Código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar Prisma Client
        run: pnpm --filter @vertice/api db:generate

      - name: Lint TypeScript/JavaScript
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias Python
        run: |
          cd apps/ai
          pip install -r requirements.txt

      - name: Lint Python (ruff)
        run: |
          cd apps/ai
          ruff check .

      - name: Typecheck Python (mypy)
        run: |
          cd apps/ai
          mypy . --ignore-missing-imports

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: vertice_test
          POSTGRES_USER: vertice
          POSTGRES_PASSWORD: vertice_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/vertice_test
          NEO4J_PLUGINS: '["apoc"]'
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 8
        ports:
          - 7687:7687
          - 7474:7474

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Aplicar migraciones de base de datos
        env:
          DATABASE_URL: postgresql://vertice:vertice_test@localhost:5432/vertice_test
        run: |
          pnpm --filter @vertice/api db:generate
          pnpm --filter @vertice/api exec prisma migrate deploy

      - name: Tests unitarios e integración (con cobertura)
        env:
          DATABASE_URL: postgresql://vertice:vertice_test@localhost:5432/vertice_test
          REDIS_URL: redis://localhost:6379
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: vertice_test
          NODE_ENV: test
        run: pnpm --filter @vertice/api test:ci

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Tests Python (pytest con cobertura)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
        run: |
          cd apps/ai
          pip install -r requirements.txt
          pytest --tb=short -q --cov=. --cov-report=xml

      - name: Reporte de cobertura
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage/lcov.info,apps/ai/coverage.xml
          fail_ci_if_error: false

  # ── Security Scan ───────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Escaneo de dependencias (pnpm audit)
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
        continue-on-error: true

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/python
            p/secrets
            p/sql-injection
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Verificar que .env no fue commiteado
        run: |
          if git log --all --full-history -- "*.env" | grep -q "commit"; then
            echo "❌ ERROR: Archivo .env detectado en historial de git"
            exit 1
          fi
          echo "✅ No hay archivos .env en el repositorio"

  # ── Build & Push Docker Images ──────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    outputs:
      image-sha: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determinar etiqueta de entorno
        id: env-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_tag=stable" >> $GITHUB_OUTPUT
          else
            echo "env_tag=staging" >> $GITHUB_OUTPUT
          fi

      # ── API ──
      - name: Build y push — API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/vertice-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/vertice-api:${{ steps.env-tag.outputs.env_tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ── Web ──
      - name: Build y push — Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.STAGING_API_URL }}
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/vertice-web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/vertice-web:${{ steps.env-tag.outputs.env_tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # ── AI ──
      - name: Build y push — AI
        uses: docker/build-push-action@v5
        with:
          context: apps/ai
          file: apps/ai/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/vertice-ai:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/vertice-ai:${{ steps.env-tag.outputs.env_tag }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

  # ── E2E Tests ───────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar browsers Playwright
        run: pnpm --filter @vertice/web exec playwright install --with-deps chromium

      - name: Build Next.js (para E2E)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.placeholder
        run: pnpm --filter @vertice/web build

      - name: Ejecutar E2E tests
        env:
          BASE_URL: http://localhost:3000
          CI: true
        run: |
          pnpm --filter @vertice/web exec next start -p 3000 &
          pnpm --filter @vertice/web exec wait-on http://localhost:3000 --timeout 30000
          pnpm --filter @vertice/web e2e

      - name: Subir reporte Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  # ── Deploy Staging ──────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.vertice.co

    steps:
      - uses: actions/checkout@v4

      - name: Configurar kubectl (staging)
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}

      - name: Aplicar manifiestos base de Kubernetes
        run: kubectl apply -f infrastructure/kubernetes/ -R

      - name: Actualizar imágenes con SHA del commit
        run: |
          SHA=${{ github.sha }}
          PREFIX=${{ env.IMAGE_PREFIX }}
          kubectl set image deployment/api api=${PREFIX}/vertice-api:${SHA} -n vertice
          kubectl set image deployment/web web=${PREFIX}/vertice-web:${SHA} -n vertice
          kubectl set image deployment/ai ai=${PREFIX}/vertice-ai:${SHA} -n vertice

      - name: Esperar rollout
        run: |
          kubectl rollout status deployment/api -n vertice --timeout=5m
          kubectl rollout status deployment/web -n vertice --timeout=5m
          kubectl rollout status deployment/ai -n vertice --timeout=5m

      - name: Verificar health post-deploy
        run: |
          sleep 15
          kubectl run health-check --image=curlimages/curl --restart=Never --rm -it \
            --command -- curl -sf http://api.vertice.svc.cluster.local:4000/health/ready
        continue-on-error: true

      - name: Notificar deploy
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: 'https://staging.vertice.co',
              description: `Deployed ${context.sha.slice(0,7)} to staging`,
              context: 'deploy/staging'
            })

  # ── Deploy Production ───────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Producción
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://vertice.co

    steps:
      - uses: actions/checkout@v4

      - name: Configurar kubectl (producción)
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_PRODUCTION }}

      - name: Aplicar manifiestos base de Kubernetes
        run: kubectl apply -f infrastructure/kubernetes/ -R

      - name: Actualizar imágenes con SHA del commit
        run: |
          SHA=${{ github.sha }}
          PREFIX=${{ env.IMAGE_PREFIX }}
          kubectl set image deployment/api api=${PREFIX}/vertice-api:${SHA} -n vertice
          kubectl set image deployment/web web=${PREFIX}/vertice-web:${SHA} -n vertice
          kubectl set image deployment/ai ai=${PREFIX}/vertice-ai:${SHA} -n vertice

      - name: Esperar rollout
        run: |
          kubectl rollout status deployment/api -n vertice --timeout=10m
          kubectl rollout status deployment/web -n vertice --timeout=10m
          kubectl rollout status deployment/ai -n vertice --timeout=10m

      - name: Verificar health post-deploy
        run: |
          sleep 20
          kubectl run health-check --image=curlimages/curl --restart=Never --rm -it \
            --command -- curl -sf http://api.vertice.svc.cluster.local:4000/health/ready

      - name: Notificar deploy
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: 'https://vertice.co',
              description: `Deployed ${context.sha.slice(0,7)} to production`,
              context: 'deploy/production'
            })
