name: VÉRTICE OS — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  # ── Lint y Typecheck ────────────────────────────────────────────────────────
  quality:
    name: Calidad de Código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Python debe instalarse ANTES de `pnpm lint`/`pnpm typecheck`: turbo
      # ejecuta también las tareas del workspace @vertice/ai, que invocan
      # ruff y mypy.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias Python
        run: |
          cd apps/ai
          pip install -r requirements.txt

      - name: Lint (TypeScript + Python)
        run: pnpm lint

      - name: Typecheck (TypeScript + Python)
        run: pnpm typecheck

  # ── Tests ─────────────────────────────────────────────────────────────[...]
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: vertice_test
          POSTGRES_USER: vertice
          POSTGRES_PASSWORD: vertice_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/vertice_test
          NEO4J_PLUGINS: '["apoc"]'
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 8
        ports:
          - 7687:7687
          - 7474:7474

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Inicializar base de datos de test
        env:
          DATABASE_URL: postgresql://vertice:vertice_test@localhost:5432/vertice_test
        run: |
          psql $DATABASE_URL -f infrastructure/db/init.sql

      # Igual que en el job de calidad: `pnpm test` incluye la tarea de
      # @vertice/ai, que ejecuta pytest.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias Python
        run: |
          cd apps/ai
          pip install -r requirements.txt

      - name: Tests (TypeScript + Python)
        env:
          DATABASE_URL: postgresql://vertice:vertice_test@localhost:5432/vertice_test
          REDIS_URL: redis://localhost:6379
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: vertice_test
          NODE_ENV: test
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
        run: pnpm test

      - name: Cobertura (API)
        env:
          NODE_ENV: test
        run: pnpm --filter @vertice/api test:ci

      - name: Reporte de cobertura
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/api/coverage/lcov.info

  # ── Security Scan ──────────────────────────────────────────────────────────[...]
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Sin continue-on-error: una vulnerabilidad alta/crítica real debe
      # bloquear el pipeline. Antes este step podía "pasar" en verde aunque
      # pnpm audit encontrara hallazgos serios — el nombre del job mentía.
      - name: Escaneo de dependencias (npm audit)
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high

      # Solo corre si el secreto está configurado — así una instalación sin
      # cuenta de Semgrep no bloquea el pipeline por un secreto ausente, pero
      # cuando SÍ corre, un hallazgo real bloquea (sin continue-on-error).
      - name: Semgrep SAST
        if: ${{ secrets.SEMGREP_APP_TOKEN != '' }}
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/python
            p/secrets
            p/sql-injection
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Verificar que .env no fue commiteado
        run: |
          if git log --all --full-history -- "*.env" | grep -q "commit"; then
            echo "❌ ERROR: Archivo .env detectado en historial de git"
            exit 1
          fi
          echo "✅ No hay archivos .env en el repositorio"

  # ── Build ─────────────────────────────────────────────────────────────[...]
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: pnpm --filter @vertice/web build

      - name: Build Docker images
        run: |
          docker build -t vertice-ai:${{ github.sha }} ./apps/ai
        if: github.ref == 'refs/heads/develop'

  # ── Deploy Staging ──────────────────────────────────────────────────────────[...]
  # ── Deploy ────────────────────────────────────────────────────────────────
  #
  # No hay jobs de deploy-staging/deploy-production todavía. Los que existían
  # aquí eran un `echo "Deploying..."` seguido de un `createCommitStatus`
  # marcando 'success' en GitHub — sin ejecutar ningún despliegue real. Eso
  # es peor que no tener el check: un checkmark verde de "deploy/staging"
  # sugiere que hay algo corriendo en https://staging.vertice.co cuando no
  # existe nada ahí, y cualquiera que confíe en ese estado se lleva una
  # sorpresa (o, peor, asume que un incidente en producción no puede venir de
  # un "deploy" que nunca ocurrió).
  #
  # Cuando exista un target real de despliegue, el job debe verificar, como
  # mínimo, antes de reportar éxito:
  #   1. imagen construida y su digest publicado
  #   2. manifiesto/comando de despliegue aplicado
  #   3. rollout completado (o servicio recibiendo el nuevo release)
  #   4. health check post-deploy respondiendo 200
  #   5. smoke test de al menos un flujo crítico
  # Solo entonces debe marcarse el commit status como success — nunca antes.
