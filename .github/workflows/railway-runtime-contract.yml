name: Railway Runtime Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/types/**'
      - 'packages/config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'railway.json'
      - '.github/workflows/railway-runtime-contract.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/types/**'
      - 'packages/config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'railway.json'
      - '.github/workflows/railway-runtime-contract.yml'

permissions:
  contents: read

jobs:
  api-runtime-contract:
    name: API production image + readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: vertice_runtime
          POSTGRES_USER: vertice
          POSTGRES_PASSWORD: vertice_runtime
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Railway configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('railway.json', 'utf8'));
          if (config.build?.builder !== 'DOCKERFILE') throw new Error('Railway must use the API Dockerfile');
          if (config.build?.dockerfilePath !== 'apps/api/Dockerfile') throw new Error('Unexpected Railway Dockerfile path');
          if (config.build?.buildCommand !== null) {
            throw new Error('Railway buildCommand must be explicitly null so stale dashboard overrides cannot replace the Dockerfile build');
          }
          if (config.deploy?.startCommand !== null) {
            throw new Error('Railway startCommand must be explicitly null so the image Docker CMD remains authoritative');
          }
          if (config.deploy?.healthcheckPath !== '/health/ready') throw new Error('Unexpected Railway readiness path');
          NODE

      - name: Build canonical API production image
        run: docker build -f apps/api/Dockerfile -t vertice-api-runtime:${{ github.sha }} .

      - name: Verify default Docker stage and Prisma prerequisites
        shell: bash
        run: |
          set -euo pipefail
          cmd=$(docker image inspect vertice-api-runtime:${{ github.sha }} --format '{{json .Config.Cmd}}')
          echo "Default image CMD: $cmd"
          echo "$cmd" | grep -F 'prisma migrate deploy --schema apps/api/prisma/schema.prisma'
          echo "$cmd" | grep -F "exec su -s /bin/sh nodeapp -c 'node apps/api/dist/index.js'"
          docker run --rm --entrypoint openssl vertice-api-runtime:${{ github.sha }} version

      - name: Start CTG One federation contract double
        shell: bash
        run: |
          set -euo pipefail
          nohup node <<'NODE' >/tmp/ctg-one-federation.log 2>&1 &
          const http = require('http')
          const expected = 'ci-federation-secret-ci-federation-secret-1234567890'
          const server = http.createServer((req, res) => {
            res.setHeader('content-type', 'application/json')
            if (req.method !== 'POST' || req.url !== '/exchange') {
              res.statusCode = 404
              res.end(JSON.stringify({ error: 'NOT_FOUND' }))
              return
            }
            if (req.headers['x-ctg-federation-secret'] !== expected) {
              res.statusCode = 401
              res.end(JSON.stringify({ error: 'UNAUTHORIZED' }))
              return
            }
            let body = ''
            req.on('data', (chunk) => { body += chunk })
            req.on('end', () => {
              try {
                const parsed = JSON.parse(body)
                if (typeof parsed.code !== 'string' || typeof parsed.code_verifier !== 'string') {
                  throw new Error('invalid')
                }
              } catch {
                res.statusCode = 400
                res.end(JSON.stringify({ error: 'INVALID_EXCHANGE_REQUEST' }))
                return
              }
              res.statusCode = 401
              res.end(JSON.stringify({ error: 'INVALID_OR_EXPIRED_CODE' }))
            })
          })
          server.listen(4101, '127.0.0.1')
          NODE
          for attempt in $(seq 1 20); do
            if curl -sS -o /dev/null http://127.0.0.1:4101/not-found; then break; fi
            sleep 0.25
          done

      - name: Start image with production-equivalent dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name vertice-api-runtime --network host \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e HOST=0.0.0.0 \
            -e DATABASE_URL=postgresql://vertice:vertice_runtime@127.0.0.1:5432/vertice_runtime \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e JWT_SECRET=ci-jwt-secret-ci-jwt-secret-ci-jwt-secret-ci-jwt-secret-12345678 \
            -e VOTE_NULLIFIER_SECRET=ci-vote-secret-ci-vote-secret-ci-vote-secret-ci-vote-secret-1234 \
            -e IDENTITY_PEPPER=ci-identity-pepper-ci-identity-pepper-ci-identity-pepper-123456 \
            -e AI_SERVICE_SECRET=ci-ai-secret-ci-ai-secret-ci-ai-secret-ci-ai-secret-1234567890 \
            -e AI_SERVICE_URL=http://127.0.0.1:8001 \
            -e CORS_ORIGIN=http://127.0.0.1:3000 \
            -e NEO4J_URI=bolt://127.0.0.1:17687 \
            -e CTG_ONE_FEDERATION_EXCHANGE_URL=http://127.0.0.1:4101/exchange \
            -e CTG_ONE_FEDERATION_SECRET=ci-federation-secret-ci-federation-secret-1234567890 \
            -e RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} \
            vertice-api-runtime:${{ github.sha }}

      - name: Require bounded production readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=''
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:4000/health/ready || true)
            if [ "$code" = '200' ]; then
              ready='yes'
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' vertice-api-runtime 2>/dev/null | grep -q true; then
              echo '::error::Production API container exited before readiness.'
              docker logs vertice-api-runtime || true
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != 'yes' ]; then
            echo '::error::Production API image did not reach readiness within 60 seconds.'
            cat /tmp/ready.json 2>/dev/null || true
            docker logs vertice-api-runtime || true
            exit 1
          fi

          cat /tmp/ready.json
          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/ready.json', 'utf8'));
          if (!['ok', 'degraded'].includes(body.status)) throw new Error(`Unexpected readiness status: ${body.status}`);
          if (body.checks?.database !== 'ok') throw new Error('Postgres is not ready');
          if (body.checks?.redis !== 'ok') throw new Error('Redis is not ready');
          if (body.checks?.neo4j !== 'fail') throw new Error('Contract must prove optional Neo4j does not block readiness');
          if (body.capabilities?.ctg_one_federation !== 'ready') throw new Error('CTG One federation capability is not ready');
          if (body.revision !== process.env.GITHUB_SHA) throw new Error(`Revision mismatch: ${body.revision}`);
          NODE

      - name: Verify liveness contract
        run: |
          curl --fail --silent --show-error http://127.0.0.1:4000/health | tee /tmp/health.json
          node -e "const b=require('/tmp/health.json'); if(b.status!=='ok'||b.revision!==process.env.GITHUB_SHA) process.exit(1)"

      - name: Verify non-destructive federation canary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:4000/health/federation | tee /tmp/federation.json
          node -e "const b=require('/tmp/federation.json'); if(b.status!=='ready'||b.remote_status!==401||b.revision!==process.env.GITHUB_SHA) process.exit(1)"

      - name: Publish runtime logs
        if: always()
        run: |
          docker logs vertice-api-runtime || true
          cat /tmp/ctg-one-federation.log 2>/dev/null || true

      - name: Stop runtime container
        if: always()
        run: docker rm -f vertice-api-runtime >/dev/null 2>&1 || true
