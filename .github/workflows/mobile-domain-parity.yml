name: Mobile Domain Parity

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
      - 'apps/api/src/modules/workflows/**'
      - 'apps/api/src/modules/identity/**'
      - 'apps/api/src/modules/crowdfunding/**'
      - 'scripts/verify-mobile-domain-parity.mjs'
      - 'docs/engineering/MOBILE_DOMAIN_PARITY_PHASE2D2_4.md'
      - '.github/workflows/mobile-domain-parity.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-domain-parity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-parity:
    name: Mobile Domain Parity
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact submitted SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source contract
        run: node scripts/verify-mobile-domain-parity.mjs

      - name: Typecheck native client
        run: pnpm --filter @vertice/mobile typecheck

      - name: Export Android bundle
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
        run: pnpm --filter @vertice/mobile exec expo export --platform android --output-dir dist/domain-parity-android

      - name: Export iOS bundle
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
        run: pnpm --filter @vertice/mobile exec expo export --platform ios --output-dir dist/domain-parity-ios

      - name: Emit certification boundary
        run: |
          echo 'Mobile Domain Parity Phase 2D-2/3/4: PASS'
          echo 'This proves exact-SHA source/type/export coherence for workflows, identity assurance and crowdfunding tracking.'
          echo 'It does not prove physical device readiness, signing, stores or external-provider certification.'
