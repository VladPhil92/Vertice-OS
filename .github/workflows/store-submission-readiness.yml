name: Store Submission Readiness

on:
  pull_request:
    paths:
      - 'apps/mobile/app.json'
      - 'apps/mobile/app/account-deletion.tsx'
      - 'apps/mobile/app/(tabs)/profile.tsx'
      - 'apps/web/app/account-deletion/page.tsx'
      - 'release/store/**'
      - 'scripts/verify-store-submission.mjs'
      - 'docs/engineering/STORE_SUBMISSION_READINESS.md'
      - '.github/workflows/store-submission-readiness.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/mobile/app.json'
      - 'apps/mobile/app/account-deletion.tsx'
      - 'apps/mobile/app/(tabs)/profile.tsx'
      - 'apps/web/app/account-deletion/page.tsx'
      - 'release/store/**'
      - 'scripts/verify-store-submission.mjs'
      - 'docs/engineering/STORE_SUBMISSION_READINESS.md'
      - '.github/workflows/store-submission-readiness.yml'
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact 40-character release SHA represented by the completed store manifest'
        required: true
        type: string
      manifest_path:
        description: 'Repository-relative completed store submission manifest'
        required: true
        default: 'release/store/store-submission.json'
        type: string

concurrency:
  group: store-submission-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Store Submission Structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Validate source-bound store submission template
        run: node scripts/verify-store-submission.mjs --mode structure --manifest release/store/store-submission.example.json
      - name: Certification boundary
        run: |
          echo 'Store submission structure: PASS'
          echo 'This job validates source/config/disclosure structure only. It does not certify legal approval, store-console completion, signed binaries, Apple review, Google review, or market release.'

  strict-store-package:
    name: Strict Store Package Validation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate release SHA input
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo 'release_sha must be an exact 40-character Git SHA'
            exit 1
          fi
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Confirm target commit exists
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: git cat-file -e "${RELEASE_SHA}^{commit}"
      - name: Validate completed internal store package
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: node scripts/verify-store-submission.mjs --mode strict --manifest "$MANIFEST_PATH" --release-sha "$RELEASE_SHA"
      - name: Certification boundary
        run: |
          echo 'Internal store submission package: READY'
          echo 'Apple/Google review approval, signed-device evidence, external provider certification and the Market Release Certification gate remain separate mandatory evidence.'
