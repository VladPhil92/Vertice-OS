name: Phase 2B Lock Sync

on:
  push:
    branches:
      - feat/mobile-device-capabilities-phase2b
    paths:
      - 'apps/mobile/package.json'

permissions:
  contents: write

concurrency:
  group: phase2b-lock-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    name: Sync Phase 2B lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Regenerate lockfile for approved native dependencies
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(mobile): sync Phase 2B dependency lockfile'
          git push origin HEAD:${GITHUB_REF_NAME}
