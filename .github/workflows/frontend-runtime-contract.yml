name: Frontend Runtime Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-runtime-contract.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-runtime-contract.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  web-runtime-contract:
    name: Web runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js with poisoned legacy API variable
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ env.MAPBOX_TOKEN }}
          # Production must ignore this historical Vercel value completely.
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: pnpm --filter @vertice/web build

      - name: Reject uncompiled Tailwind directives
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '@tailwind[[:space:]]|@apply[[:space:]]' apps/web/.next/static/css 2>/dev/null; then
            echo '::error::Production CSS contains uncompiled Tailwind/PostCSS directives.'
            exit 1
          fi
          if ! grep -R -q 'display:flex' apps/web/.next/static/css 2>/dev/null; then
            echo '::error::Compiled CSS is missing expected Tailwind utility output.'
            exit 1
          fi
          echo 'Tailwind/PostCSS output is compiled.'

      - name: Enforce same-origin browser API contract
        shell: bash
        run: |
          set -euo pipefail
          # A development fallback literal may remain in shared client code even
          # when the production branch evaluates to /_api. What must never be
          # shipped to the browser is the Railway upstream itself, and the
          # canonical same-origin gateway must be present. The following step
          # exercises that production behavior end-to-end.
          if grep -R -n -E 'https?://[^"[:space:]]*up\.railway\.app' apps/web/.next/static 2>/dev/null; then
            echo '::error::Railway upstream leaked into a browser bundle; production must be same-origin.'
            exit 1
          fi
          if ! grep -R -q '/_api' apps/web/.next/static 2>/dev/null; then
            echo '::error::Browser bundles do not contain the canonical /_api gateway.'
            exit 1
          fi
          echo 'Browser bundles expose /_api and do not expose the Railway upstream.'

      - name: Exercise same-origin proxy and refresh-cookie path
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE' >/tmp/vertice-mock-api.log 2>&1 &
          const http = require('http')
          const server = http.createServer((req, res) => {
            res.setHeader('content-type', 'application/json')
            if (req.url?.startsWith('/health')) {
              res.end(JSON.stringify({ status: 'ok', path: req.url }))
              return
            }
            if (req.url === '/auth/ctgone/exchange' && req.method === 'POST') {
              res.setHeader('set-cookie', 'vertice_refresh=mock-refresh; Path=/auth; HttpOnly; SameSite=Strict')
              res.end(JSON.stringify({ access_token: 'mock-access', citizen_id: '00000000-0000-4000-8000-000000000001' }))
              return
            }
            res.statusCode = 404
            res.end(JSON.stringify({ error: 'not found' }))
          })
          server.listen(4100, '127.0.0.1')
          NODE
          MOCK_PID=$!

          cleanup() {
            kill "${WEB_PID:-}" "${MOCK_PID:-}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          if [ -f apps/web/.next/standalone/apps/web/server.js ]; then
            VERTICE_API_UPSTREAM=http://127.0.0.1:4100 PORT=3000 HOSTNAME=127.0.0.1 \
              node apps/web/.next/standalone/apps/web/server.js >/tmp/vertice-web.log 2>&1 &
          else
            VERTICE_API_UPSTREAM=http://127.0.0.1:4100 PORT=3000 \
              pnpm --filter @vertice/web start >/tmp/vertice-web.log 2>&1 &
          fi
          WEB_PID=$!

          pnpm --filter @vertice/web exec wait-on http://127.0.0.1:3000/_api/health

          curl --fail --silent --show-error \
            'http://127.0.0.1:3000/_api/health?probe=same-origin' \
            | tee /tmp/proxy-health.json
          node -e "const b=require('/tmp/proxy-health.json'); if(b.path!=='/health?probe=same-origin') process.exit(1)"

          curl --fail --silent --show-error \
            -D /tmp/proxy-auth.headers \
            -o /tmp/proxy-auth.json \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"code":"mock","code_verifier":"mock"}' \
            http://127.0.0.1:3000/_api/auth/ctgone/exchange

          grep -Eiq '^set-cookie: vertice_refresh=mock-refresh;.*Path=/_api/auth' /tmp/proxy-auth.headers
          if grep -Eiq '^set-cookie:.*Domain=' /tmp/proxy-auth.headers; then
            echo '::error::Proxy must not expose an upstream cookie Domain attribute.'
            exit 1
          fi
          node -e "const b=require('/tmp/proxy-auth.json'); if(b.access_token!=='mock-access') process.exit(1)"

          echo 'Same-origin proxy and first-party refresh-cookie contract passed.'
