name: Golden E2E Journeys

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: golden-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  golden-browser-contracts:
    name: Golden Browser Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @vertice/web exec playwright install --with-deps chromium

      - name: Build web application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_MAPBOX_TOKEN: test-mapbox-token
        run: pnpm --filter @vertice/web build

      - name: Start web application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_MAPBOX_TOKEN: test-mapbox-token
        run: |
          pnpm --filter @vertice/web start > /tmp/vertice-web.log 2>&1 &
          pnpm --filter @vertice/web exec wait-on http://localhost:3000 --timeout 120000

      - name: Run deterministic golden browser suite
        env:
          BASE_URL: http://localhost:3000
        run: pnpm --filter @vertice/web e2e:golden

      - name: Upload web log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-browser-web-log
          path: /tmp/vertice-web.log
          if-no-files-found: ignore

  golden-api-journeys:
    name: Golden API Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: vertice_test
          POSTGRES_USER: vertice
          POSTGRES_PASSWORD: vertice_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/vertice_test
          NEO4J_PLUGINS: '["apoc"]'
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 8
        ports:
          - 7687:7687
          - 7474:7474

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize integration database
        env:
          DATABASE_URL: postgresql://vertice:vertice_test@localhost:5432/vertice_test
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infrastructure/db/init.sql

          # init.sql is the historical integration baseline. Golden journeys
          # apply the exact forward slices required by current runtime contracts.
          for migration in \
            apps/api/prisma/migrations/20260902233000_superadmin_role_authority/migration.sql \
            apps/api/prisma/migrations/20260903013500_frozen_electorate_transition_hardening/migration.sql \
            apps/api/prisma/migrations/20260903015000_civic_identity_proofing/migration.sql \
            apps/api/prisma/migrations/20260903020500_frozen_voter_roll_identity_guard/migration.sql \
            apps/api/prisma/migrations/20260903032000_civic_proof_provider_isolation/migration.sql \
            apps/api/prisma/migrations/20260906160000_civic_social_profiles/migration.sql \
            apps/api/prisma/migrations/20260906191500_civic_actions_core/migration.sql \
            apps/api/prisma/migrations/20260907223000_least_privilege_session_activation/migration.sql \
            apps/api/prisma/migrations/20260908111500_operation_idempotency_phase6/migration.sql \
            apps/api/prisma/migrations/20260909001500_mobile_push_devices/migration.sql
          do
            echo "Applying Golden schema slice: $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run real API golden journeys
        env:
          GOLDEN_API_JOURNEYS: '1'
          NODE_ENV: test
          DATABASE_URL: postgresql://vertice:vertice_test@localhost:5432/vertice_test
          REDIS_URL: redis://localhost:6379
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: vertice_test
          JWT_SECRET: golden-test-jwt-secret-with-at-least-32-characters
          CORS_ORIGIN: http://localhost:3000
          VOTE_NULLIFIER_SECRET: golden-vote-nullifier-secret-32-chars-minimum
          IDENTITY_PEPPER: golden-identity-pepper-32-chars-minimum
          DID_COMMITMENT_PEPPER: golden-did-commitment-pepper-32-chars-minimum
          CIVIC_IDENTITY_ASSURANCE_PROVIDERS: trusted_kyc
          CIVIC_IDENTITY_PROOFING_ADAPTER_KEYS_JSON: '{"trusted_kyc":{"golden-key":"golden-trusted-kyc-adapter-secret-32-characters-minimum"}}'
        run: pnpm --filter @vertice/api test -- golden-journeys.integration.test.ts golden-territorial.integration.test.ts golden-governance.integration.test.ts golden-mobile-engagement.integration.test.ts --runInBand
        run: pnpm --filter @vertice/api test -- golden-journeys.integration.test.ts golden-territorial.integration.test.ts golden-governance.integration.test.ts golden-mobile-push.integration.test.ts --runInBand
