name: Territorial Assurance Certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/modules/territories/territory-assurance.service.ts'
      - 'apps/api/src/modules/territories/territory-assurance-certification.ts'
      - 'apps/api/src/modules/territories/__tests__/territory-assurance-certification.test.ts'
      - 'apps/api/src/modules/governance/governance.service.ts'
      - 'apps/api/src/__tests__/golden-territory-assurance.integration.test.ts'
      - 'apps/api/src/__tests__/golden-governance.integration.test.ts'
      - 'apps/api/src/__tests__/golden-territorial-assurance-certification.integration.test.ts'
      - 'apps/api/prisma/migrations/**/migration.sql'
      - 'apps/web/app/dashboard/territory/page.tsx'
      - 'apps/web/app/dashboard/governance/page.tsx'
      - 'apps/mobile/app/territory/assurance.tsx'
      - 'apps/mobile/app/(tabs)/governance.tsx'
      - 'scripts/verify-territorial-assurance-certification.mjs'
      - 'docs/engineering/TERRITORIAL_ASSURANCE_CERTIFICATION_PHASE7G4.md'
      - 'docs/operations/territorial-assurance-certification-evidence.example.json'
      - '.github/workflows/territorial-assurance-certification.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/src/modules/territories/territory-assurance.service.ts'
      - 'apps/api/src/modules/territories/territory-assurance-certification.ts'
      - 'apps/api/src/modules/territories/__tests__/territory-assurance-certification.test.ts'
      - 'apps/api/src/modules/governance/governance.service.ts'
      - 'apps/api/src/__tests__/golden-territory-assurance.integration.test.ts'
      - 'apps/api/src/__tests__/golden-governance.integration.test.ts'
      - 'apps/api/src/__tests__/golden-territorial-assurance-certification.integration.test.ts'
      - 'apps/api/prisma/migrations/**/migration.sql'
      - 'apps/web/app/dashboard/territory/page.tsx'
      - 'apps/web/app/dashboard/governance/page.tsx'
      - 'apps/mobile/app/territory/assurance.tsx'
      - 'apps/mobile/app/(tabs)/governance.tsx'
      - 'scripts/verify-territorial-assurance-certification.mjs'
      - 'docs/engineering/TERRITORIAL_ASSURANCE_CERTIFICATION_PHASE7G4.md'
      - 'docs/operations/territorial-assurance-certification-evidence.example.json'
      - '.github/workflows/territorial-assurance-certification.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  repository-certification:
    name: Exact-SHA territorial assurance certification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: vertice_territory_cert
          POSTGRES_USER: vertice
          POSTGRES_PASSWORD: vertice_cert
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/vertice_cert
          NEO4J_PLUGINS: '["apoc"]'
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 8
        ports:
          - 7687:7687
          - 7474:7474

    steps:
      - name: Checkout exact submitted SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Assert exact SHA checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "TERRITORIAL_ASSURANCE_CANDIDATE_SHA=$actual"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @vertice/types build

      - name: Typecheck API
        run: pnpm --filter @vertice/api typecheck

      - name: Verify Phase 7G.4 source contract
        run: node scripts/verify-territorial-assurance-certification.mjs

      - name: Execute certification policy tests
        env:
          NODE_ENV: test
        run: >-
          pnpm --filter @vertice/api exec jest --runInBand
          src/modules/territories/__tests__/territory-assurance-certification.test.ts

      - name: Initialize exact assurance integration schema
        env:
          DATABASE_URL: postgresql://vertice:vertice_cert@localhost:5432/vertice_territory_cert
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infrastructure/db/init.sql

          for migration in \
            apps/api/prisma/migrations/20260902233000_superadmin_role_authority/migration.sql \
            apps/api/prisma/migrations/20260903013500_frozen_electorate_transition_hardening/migration.sql \
            apps/api/prisma/migrations/20260903015000_civic_identity_proofing/migration.sql \
            apps/api/prisma/migrations/20260903020500_frozen_voter_roll_identity_guard/migration.sql \
            apps/api/prisma/migrations/20260903032000_civic_proof_provider_isolation/migration.sql \
            apps/api/prisma/migrations/20260906160000_civic_social_profiles/migration.sql \
            apps/api/prisma/migrations/20260906191500_civic_actions_core/migration.sql \
            apps/api/prisma/migrations/20260907223000_least_privilege_session_activation/migration.sql \
            apps/api/prisma/migrations/20260908111500_operation_idempotency_phase6/migration.sql \
            apps/api/prisma/migrations/20260909033000_national_territory_platform_phase7a/migration.sql \
            apps/api/prisma/migrations/20260910033000_community_ugc_trust_safety/migration.sql \
            apps/api/prisma/migrations/20260910122000_national_territory_mobility_context/migration.sql \
            apps/api/prisma/migrations/20260910131500_territory_boundary_integrity/migration.sql \
            apps/api/prisma/migrations/20260910173000_territory_residence_assurance_phase7g1/migration.sql \
            apps/api/prisma/migrations/20260910184500_territorial_governance_eligibility_phase7g2/migration.sql
          do
            echo "Applying certification schema slice: $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Execute real assurance and governance Golden journeys
        env:
          GOLDEN_API_JOURNEYS: '1'
          NODE_ENV: test
          DATABASE_URL: postgresql://vertice:vertice_cert@localhost:5432/vertice_territory_cert
          REDIS_URL: redis://localhost:6379
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: vertice_cert
          JWT_SECRET: territorial-certification-jwt-secret-32-characters-minimum
          CORS_ORIGIN: http://localhost:3000
          VOTE_NULLIFIER_SECRET: territorial-certification-vote-nullifier-secret-minimum
          IDENTITY_PEPPER: territorial-certification-identity-pepper-minimum
          DID_COMMITMENT_PEPPER: territorial-certification-did-pepper-minimum
          CIVIC_IDENTITY_ASSURANCE_PROVIDERS: trusted_kyc
          CIVIC_IDENTITY_PROOFING_ADAPTER_KEYS_JSON: '{"trusted_kyc":{"cert-key":"territorial-certification-adapter-secret-minimum"}}'
        run: >-
          pnpm --filter @vertice/api test --
          golden-territory-assurance.integration.test.ts
          golden-governance.integration.test.ts
          golden-territorial-assurance-certification.integration.test.ts
          --runInBand

      - name: Emit certification boundary
        shell: bash
        run: |
          echo "TERRITORIAL_ASSURANCE_REPOSITORY_CERTIFICATION=PASS"
          echo "TERRITORIAL_ASSURANCE_RELEASE_BOUNDARY=EXTERNAL_EVIDENCE_REQUIRED"
          echo "A green repository gate does not certify a production election."
