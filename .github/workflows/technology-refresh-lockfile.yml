name: Technology Refresh Lockfile

on:
  push:
    branches:
      - feat/technology-refresh-mobile-2026-09
    paths:
      - package.json
      - apps/web/package.json
      - apps/mobile/package.json
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: technology-refresh-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
      - name: Regenerate lockfile deterministically
        run: pnpm install --lockfile-only
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): synchronize pnpm lockfile"
          git push
