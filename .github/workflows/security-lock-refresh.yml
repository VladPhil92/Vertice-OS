name: Security Lock Refresh

on:
  push:
    branches:
      - fix/railway-production-readiness-20260901
    paths:
      - 'package.json'
      - '.github/workflows/security-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/railway-production-readiness-20260901
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile from security overrides
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Enforce high-severity audit gate
        run: pnpm audit --audit-level=high

      - name: Commit deterministic lockfile refresh
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already satisfies the overrides.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(deps): refresh lockfile for security overrides'
          git push origin HEAD:fix/railway-production-readiness-20260901
