name: Apply assurance integrity patch

on:
  push:
    branches:
      - feat/civic-identity-assurance-p0
    paths:
      - .github/workflows/patch-assurance-p1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic governance patch
        shell: python
        run: |
          from pathlib import Path

          service = Path('apps/api/src/modules/governance/governance.service.ts')
          text = service.read_text()
          old = '''  const delegatorRows = await prisma.$queryRaw<Array<{
            delegator_id: string
            reputation_score: string
          }>>(Prisma.sql`
            SELECT d.delegator_id, c.reputation_score
            FROM delegations d
            JOIN citizens c ON c.id = d.delegator_id
            INNER JOIN proposal_voter_roll pvr
              ON pvr.citizen_id = d.delegator_id
             AND pvr.proposal_id = ${proposalId}::uuid
            WHERE d.delegate_id = ${citizenId}::uuid
              AND d.is_active = true
              AND d.valid_from <= NOW()
              AND (d.valid_until IS NULL OR d.valid_until > NOW())
              AND (
                d.delegation_type = 'general'
                OR (d.delegation_type = 'domain' AND d.domain = ${proposal.category})
                OR (d.delegation_type = 'proposal' AND d.proposal_id = ${proposalId}::uuid)
              )
          `)
          '''
          new = '''  const delegatorRows = await prisma.$queryRaw<Array<{
            delegator_id: string
            reputation_score: string
          }>>(Prisma.sql`
            WITH effective_delegations AS (
              SELECT DISTINCT ON (d.delegator_id)
                d.delegator_id,
                d.delegate_id
              FROM delegations d
              INNER JOIN proposal_voter_roll pvr
                ON pvr.citizen_id = d.delegator_id
               AND pvr.proposal_id = ${proposalId}::uuid
              WHERE d.is_active = true
                AND d.valid_from <= NOW()
                AND (d.valid_until IS NULL OR d.valid_until > NOW())
                AND (
                  d.delegation_type = 'general'
                  OR (d.delegation_type = 'domain' AND d.domain = ${proposal.category})
                  OR (d.delegation_type = 'proposal' AND d.proposal_id = ${proposalId}::uuid)
                )
              ORDER BY
                d.delegator_id,
                CASE d.delegation_type
                  WHEN 'proposal' THEN 3
                  WHEN 'domain' THEN 2
                  ELSE 1
                END DESC,
                d.created_at DESC,
                d.id DESC
            )
            SELECT ed.delegator_id, c.reputation_score
            FROM effective_delegations ed
            JOIN citizens c ON c.id = ed.delegator_id
            WHERE ed.delegate_id = ${citizenId}::uuid
          `)
          '''
          if old not in text:
              raise SystemExit('expected delegation block not found')
          service.write_text(text.replace(old, new, 1))

          test = Path('apps/api/src/modules/governance/__tests__/governance.assurance-policy.test.ts')
          t = test.read_text()
          needle = '''    expect(delegationSql).toContain('proposal_voter_roll')
              expect(delegationSql).toContain('pvr.proposal_id')
              expect(delegationSql).toContain('pvr.citizen_id')
          '''
          replacement = '''    expect(delegationSql).toContain('proposal_voter_roll')
              expect(delegationSql).toContain('pvr.proposal_id')
              expect(delegationSql).toContain('pvr.citizen_id')
              expect(delegationSql).toContain('WITH effective_delegations AS')
              expect(delegationSql).toContain('DISTINCT ON (d.delegator_id)')
              expect(delegationSql).toContain("WHEN 'proposal' THEN 3")
              expect(delegationSql).toContain("WHEN 'domain' THEN 2")
              expect(delegationSql).toContain('WHERE ed.delegate_id')
          '''
          if needle not in t:
              raise SystemExit('expected assurance test block not found')
          test.write_text(t.replace(needle, replacement, 1))

          docs = Path('docs/security/CIVIC_IDENTITY_ASSURANCE.md')
          docs.write_text('''# P0 — Civic Identity Assurance

## Objective

Separate three concepts that must never be treated as equivalent in VÉRTICE OS:

1. **Authentication** — the user controls a VÉRTICE/CTG One session.
2. **Contact verification** — the user controls the declared email/contact channel.
3. **Civic identity assurance** — an independently trusted provider has performed identity proofing strong enough for a civic-governance action.

The legacy `verification_level` remains useful for onboarding, but it is not proof that the declared Colombian identity belongs to the person operating the account.

## P0.2 trust contract

VÉRTICE reuses the durable `external_identities` mapping as the attachment point for identity providers, with an explicit policy boundary:

- only provider identifiers listed in `CIVIC_IDENTITY_ASSURANCE_PROVIDERS` are accepted as civic identity evidence when a **new voter roll is frozen**;
- the allowlist is empty by default, so no new protected electorate can be formed without an audited provider;
- `ctg_one` federation is **not** implicitly an assurance provider;
- a citizen also needs `verification_level >= 2` when entering a new voter roll, so contact verification remains a prerequisite;
- `/identity/assurance` exposes the current assurance state without relabeling declared-document or email checks as KYC.

When a proposal enters `voting`, `proposal_voter_roll` becomes the immutable authorization snapshot for that voting window. The vote path does **not** re-evaluate the live provider allowlist, because changing provider policy mid-vote must not alter the electorate while leaving the frozen quorum denominator unchanged.

Provider-policy changes therefore affect future voter rolls. They do not retroactively add or remove citizens from an already-open consultation.

## Delegation invariant

Delegated participation is governed by the same frozen electorate. A delegator contributes only if present in `proposal_voter_roll`, the delegation is active and within its validity window, and its scope applies to the proposal.

When multiple scopes overlap, VÉRTICE resolves exactly one effective delegation per delegator using deterministic precedence:

1. proposal-specific delegation;
2. matching domain delegation;
3. general delegation.

Within the same precedence level, the most recent delegation wins. A citizen can therefore contribute at most one unit of delegated voting weight to a proposal.

## Provider onboarding rule

A provider must not be added to the allowlist until the integration guarantees that its `external_identities` row is created only after a successful identity-proofing result. SSO, email matching, wallet ownership, account age, civic reputation, or possession of a CTG One account are insufficient by themselves.

For a Cartagena pilot, the selected provider should be evaluated for, at minimum:

- government-issued document verification appropriate to Colombia;
- anti-spoofing / liveness or an equivalent person-presence control where applicable;
- duplicate-person resistance;
- auditable verification outcome and provider reference;
- revocation/review path;
- data-minimization and retention controls compatible with Colombian data-protection obligations;
- operational availability and incident response.

## Deliberate limitations of P0.2

This phase establishes the trust boundary and freezes a consistent assured electorate, but does not claim full identity maturity yet. Follow-up phases must:

1. integrate the selected production identity provider and signed callback/webhook contract;
2. persist assurance lifecycle metadata (verified/revoked/expired/review) independently from generic federation links;
3. extend assurance requirements to proposal creation and endorsement according to the governance policy;
4. add administrative review, revocation, reconciliation and audit evidence;
5. expose actionable assurance onboarding in the citizen dashboard;
6. persist delegated-participation receipts so quorum and audit trails account for indirect participation explicitly rather than only through aggregate weight.

## Security invariant

**No code path may infer general civic identity assurance merely from a login, matching email, CTG One federation, self-declared cédula, wallet signature, reputation score, or historical voter-roll membership.** Membership in the frozen roll authorizes participation only in that specific proposal's voting window; it is not reusable assurance evidence elsewhere.
''')
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-assurance-p1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(governance): enforce single effective delegation"
          git push
