name: Android Public Release Certification Phase 1

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/app.json'
      - 'apps/mobile/eas.json'
      - 'apps/web/app/privacy-policy/**'
      - 'apps/web/app/account-deletion/**'
      - 'docs/product/store-assets/google-play/**'
      - 'release/store/store-submission.json'
      - 'release/evidence/market-release.json'
      - 'scripts/verify-store-submission.mjs'
      - 'scripts/verify-market-release-evidence.mjs'
      - 'docs/engineering/ANDROID_PUBLIC_RELEASE_CERTIFICATION_PHASE_1.md'
      - '.github/workflows/android-public-release-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-public-release-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release-candidate-contract:
    name: Android Public Release Candidate Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout candidate evidence ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: evidence-source

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Resolve and bind frozen source SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          STORE_SHA="$(node -p "require('./evidence-source/release/store/store-submission.json').release_sha")"
          MARKET_SHA="$(node -p "require('./evidence-source/release/evidence/market-release.json').release_sha")"
          test "$STORE_SHA" = "$MARKET_SHA"
          printf '%s' "$STORE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          test "$STORE_SHA" != "0000000000000000000000000000000000000000"
          git -C evidence-source cat-file -e "${STORE_SHA}^{commit}"
          echo "release_sha=$STORE_SHA" >> "$GITHUB_OUTPUT"
          echo "Frozen release source SHA: $STORE_SHA"

      - name: Checkout exact frozen release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.release_sha }}
          fetch-depth: 1
          path: release-source

      - name: Stage candidate manifests beside frozen source
        run: |
          cp evidence-source/release/store/store-submission.json release-source/release/store/store-submission.runtime.json
          cp evidence-source/release/evidence/market-release.json release-source/release/evidence/market-release.runtime.json

      - name: Validate candidate manifests against frozen source
        working-directory: release-source
        run: |
          node scripts/verify-store-submission.mjs --mode structure --manifest release/store/store-submission.runtime.json
          node scripts/verify-market-release-evidence.mjs --mode structure --manifest release/evidence/market-release.runtime.json

      - name: Verify Android production profile contract at frozen SHA
        working-directory: release-source
        run: |
          node <<'NODE'
          const app = require('./apps/mobile/app.json').expo
          const eas = require('./apps/mobile/eas.json')
          const failures = []
          const assert = (value, message) => { if (!value) failures.push(message) }

          assert(app.name === 'Vértice OS', 'unexpected app name')
          assert(app.slug === 'vertice-os', 'unexpected Expo slug')
          assert(app.android?.package === 'com.ctgone.verticeos', 'unexpected Android package')
          assert(app.ios?.bundleIdentifier === 'com.ctgone.verticeos', 'unexpected iOS bundle id')
          assert(eas.cli?.requireCommit === true, 'EAS must require a committed source state')
          assert(eas.cli?.appVersionSource === 'remote', 'EAS appVersionSource must remain remote')
          assert(eas.build?.production?.distribution === 'store', 'production distribution must be store')
          assert(eas.build?.production?.android?.buildType === 'app-bundle', 'production Android artifact must be an AAB')
          assert(eas.build?.production?.autoIncrement === true, 'production build must auto-increment store version')
          assert(eas.build?.production?.env?.APP_VARIANT === 'production', 'production APP_VARIANT must be explicit')
          assert(eas.build?.production?.env?.EXPO_PUBLIC_RELEASE_CHANNEL === 'production', 'production release channel must be explicit')

          const api = eas.build?.production?.env?.EXPO_PUBLIC_API_URL
          try {
            const parsed = new URL(api)
            assert(parsed.protocol === 'https:', 'production API must use HTTPS')
          } catch {
            failures.push('production API URL must be absolute')
          }

          if (failures.length) {
            for (const failure of failures) console.error('- ' + failure)
            process.exit(1)
          }
          console.log('Android production profile contract at frozen SHA: PASS')
          NODE

      - name: Verify public policy routes and core Google Play assets at frozen SHA
        working-directory: release-source
        run: |
          test -f apps/web/app/privacy-policy/page.tsx
          test -f apps/web/app/account-deletion/page.tsx
          test -f docs/product/store-assets/google-play/icon-512.png
          test -f docs/product/store-assets/google-play/feature-graphic-1024x500.png
          echo 'Frozen source policy routes + icon + feature graphic: PASS'
          echo 'Phone screenshots remain an artifact/operator blocker until captured from the production-representative build.'

      - name: Validate store strict-transition behavior
        working-directory: release-source
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.release_sha }}
        run: |
          set -uo pipefail
          set +e
          node scripts/verify-store-submission.mjs --mode strict --manifest release/store/store-submission.runtime.json --release-sha "$RELEASE_SHA"
          STRICT_STATUS=$?
          set -e

          COMPLETION_INTENT="$(node <<'NODE'
          const m = require('./release/store/store-submission.runtime.json')
          const reviewsFinal = Object.values(m.store_reviews ?? {}).every((item) => item?.status === 'approved')
          const dataFinal = (m.data_inventory ?? []).every((item) => item?.review_status === 'approved')
          const legalFinal = [m.legal_identity?.developer_name, m.legal_identity?.privacy_contact]
            .every((value) => typeof value === 'string' && value.length >= 3 && !/PENDING_|CHANGE_ME|REPLACE_ME/i.test(value))
          process.stdout.write(reviewsFinal && dataFinal && legalFinal ? 'complete' : 'incomplete')
          NODE
          )"

          if [ "$COMPLETION_INTENT" = "complete" ] && [ "$STRICT_STATUS" -ne 0 ]; then
            echo 'Store manifest claims completion but fails strict validation.' >&2
            exit "$STRICT_STATUS"
          fi

          if [ "$STRICT_STATUS" -eq 0 ]; then
            echo 'Strict store package: READY.'
          else
            echo 'Strict store package: BLOCKED by explicitly incomplete approvals/evidence, as allowed during Phase 1.'
          fi

      - name: Validate market-evidence strict-transition behavior
        working-directory: release-source
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.release_sha }}
        run: |
          set -uo pipefail
          set +e
          node scripts/verify-market-release-evidence.mjs --mode strict --manifest release/evidence/market-release.runtime.json --release-sha "$RELEASE_SHA"
          STRICT_STATUS=$?
          set -e

          COMPLETION_INTENT="$(node <<'NODE'
          const m = require('./release/evidence/market-release.runtime.json')
          const final = (m.evidence ?? []).every((item) => item?.status !== 'pending' && item?.status !== 'blocked')
          process.stdout.write(final ? 'complete' : 'incomplete')
          NODE
          )"

          if [ "$COMPLETION_INTENT" = "complete" ] && [ "$STRICT_STATUS" -ne 0 ]; then
            echo 'Market evidence claims completion but fails strict validation.' >&2
            exit "$STRICT_STATUS"
          fi

          if [ "$STRICT_STATUS" -eq 0 ]; then
            echo 'Strict market evidence bundle: COMPLETE.'
          else
            echo 'Strict market certification: BLOCKED by explicitly incomplete evidence, as allowed during Phase 1.'
          fi

      - name: Phase 1 result
        run: |
          echo 'ANDROID PUBLIC RELEASE CERTIFICATION — PHASE 1: REPOSITORY CONTRACT READY'
          echo 'All source/config checks above were executed against the exact frozen release SHA.'
          echo 'The workflow remains green both while evidence is explicitly pending and after a correctly completed strict manifest; completed-but-invalid evidence fails closed.'
          echo 'This is not Google Play production approval.'
