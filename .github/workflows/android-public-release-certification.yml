name: Android Public Release Certification Phase 1

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/app.json'
      - 'apps/mobile/eas.json'
      - 'apps/web/app/privacy-policy/**'
      - 'apps/web/app/account-deletion/**'
      - 'docs/product/store-assets/google-play/**'
      - 'release/store/store-submission.json'
      - 'release/evidence/market-release.json'
      - 'scripts/verify-store-submission.mjs'
      - 'scripts/verify-market-release-evidence.mjs'
      - 'docs/engineering/ANDROID_PUBLIC_RELEASE_CERTIFICATION_PHASE_1.md'
      - '.github/workflows/android-public-release-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-public-release-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release-candidate-contract:
    name: Android Public Release Candidate Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout candidate evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Validate candidate manifests structurally
        run: |
          node scripts/verify-store-submission.mjs --mode structure --manifest release/store/store-submission.json
          node scripts/verify-market-release-evidence.mjs --mode structure --manifest release/evidence/market-release.json

      - name: Bind both manifests to the same frozen source SHA
        shell: bash
        run: |
          set -euo pipefail
          STORE_SHA="$(node -p "require('./release/store/store-submission.json').release_sha")"
          MARKET_SHA="$(node -p "require('./release/evidence/market-release.json').release_sha")"
          test "$STORE_SHA" = "$MARKET_SHA"
          printf '%s' "$STORE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          test "$STORE_SHA" != "0000000000000000000000000000000000000000"
          git cat-file -e "${STORE_SHA}^{commit}"
          git merge-base --is-ancestor "$STORE_SHA" HEAD
          echo "Frozen release source SHA: $STORE_SHA"

      - name: Verify Android production profile contract
        run: |
          node <<'NODE'
          const app = require('./apps/mobile/app.json').expo
          const eas = require('./apps/mobile/eas.json')
          const failures = []
          const assert = (value, message) => { if (!value) failures.push(message) }

          assert(app.name === 'Vértice OS', 'unexpected app name')
          assert(app.slug === 'vertice-os', 'unexpected Expo slug')
          assert(app.android?.package === 'com.ctgone.verticeos', 'unexpected Android package')
          assert(app.ios?.bundleIdentifier === 'com.ctgone.verticeos', 'unexpected iOS bundle id')
          assert(eas.cli?.requireCommit === true, 'EAS must require a committed source state')
          assert(eas.cli?.appVersionSource === 'remote', 'EAS appVersionSource must remain remote')
          assert(eas.build?.production?.distribution === 'store', 'production distribution must be store')
          assert(eas.build?.production?.android?.buildType === 'app-bundle', 'production Android artifact must be an AAB')
          assert(eas.build?.production?.autoIncrement === true, 'production build must auto-increment store version')
          assert(eas.build?.production?.env?.APP_VARIANT === 'production', 'production APP_VARIANT must be explicit')
          assert(eas.build?.production?.env?.EXPO_PUBLIC_RELEASE_CHANNEL === 'production', 'production release channel must be explicit')

          const api = eas.build?.production?.env?.EXPO_PUBLIC_API_URL
          try {
            const parsed = new URL(api)
            assert(parsed.protocol === 'https:', 'production API must use HTTPS')
          } catch {
            failures.push('production API URL must be absolute')
          }

          if (failures.length) {
            for (const failure of failures) console.error('- ' + failure)
            process.exit(1)
          }
          console.log('Android production profile contract: PASS')
          NODE

      - name: Verify public policy routes and core Google Play assets
        run: |
          test -f apps/web/app/privacy-policy/page.tsx
          test -f apps/web/app/account-deletion/page.tsx
          test -f docs/product/store-assets/google-play/icon-512.png
          test -f docs/product/store-assets/google-play/feature-graphic-1024x500.png
          echo 'Public policy route source + icon + feature graphic: PASS'
          echo 'Phone screenshots remain an external/artifact blocker until captured from a production-representative build.'

      - name: Prove strict store certification remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(node -p "require('./release/store/store-submission.json').release_sha")"
          if node scripts/verify-store-submission.mjs --mode strict --manifest release/store/store-submission.json --release-sha "$RELEASE_SHA"; then
            echo 'Store manifest unexpectedly passed strict certification before real approvals were attached.' >&2
            exit 1
          fi
          echo 'Strict store package correctly remains BLOCKED pending real approvals/evidence.'

      - name: Prove strict market certification remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(node -p "require('./release/evidence/market-release.json').release_sha")"
          if node scripts/verify-market-release-evidence.mjs --mode strict --manifest release/evidence/market-release.json --release-sha "$RELEASE_SHA"; then
            echo 'Market evidence unexpectedly passed strict certification before real evidence was attached.' >&2
            exit 1
          fi
          echo 'Strict market certification correctly remains BLOCKED pending physical/external/legal/store evidence.'

      - name: Phase 1 result
        run: |
          echo 'ANDROID PUBLIC RELEASE CERTIFICATION — PHASE 1: REPOSITORY CONTRACT READY'
          echo 'This is not Google Play production approval.'
          echo 'Next boundary: real signing/Play App Signing + production Maps/push credentials + signed AAB + Play testing track + physical-device smoke + Play Console declarations.'
